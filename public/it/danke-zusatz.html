    <script>
        // Supabase Config
        const SUPABASE_URL = 'https://xomsibpyksrzrnixbdwf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvbXNpYnB5a3NyenJuaXhiZHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2NjMxMjIsImV4cCI6MjA3MjIzOTEyMn0.ZgCwog94HUHz39lbGMJkFPeZ6c-nL4AMFFTz5AgwnKE';

        // Hundename aus localStorage
        const dogName = localStorage.getItem('dogName') || 'il tuo cane';
        document.querySelector('.dog-name').textContent = dogName;

        // Parameter aus URL
        const urlParams = new URLSearchParams(window.location.search);
        const module = urlParams.get('module');
        const leadId = urlParams.get('lead_id') || localStorage.getItem('leadId');

        // ALLE Module (inkl. fehlende)
        const moduleData = {
            'anxiety': { icon: '😰', name: 'Prevenzione dell\'ansia da separazione', exercises: '8 esercizi' },
            'pulling': { icon: '🦮', name: 'Basi della condotta al guinzaglio', exercises: '6 esercizi' },
            'barking': { icon: '🔊', name: 'Addestramento anti-abbaio', exercises: '6 esercizi' },
            'aggression': { icon: '😤', name: 'Controllo dell\'aggressività', exercises: '8 esercizi' },
            'recall': { icon: '📣', name: 'Addestramento al richiamo', exercises: '6 esercizi' },
            'jumping': { icon: '🐕', name: 'Addestramento anti-salto', exercises: '5 esercizi' },
            'energy': { icon: '⚡', name: 'Gestione dell\'energia', exercises: '6 esercizi' },
            'destructive': { icon: '🧸', name: 'Addestramento anti-distruzione', exercises: '6 esercizi' },
            'mouthing': { icon: '🦴', name: 'Non raccogliere da terra', exercises: '6 esercizi' }
        };

        if (module) {
            // Bundle erkennen (z.B. "pulling+anxiety")
            const isBundle = module.includes('+');

            let displayIcon, displayName, displayDesc, upsellValue;

            if (isBundle) {
                const modules = module.split('+');
                const mainModule = modules[0];
                displayIcon = '📦';
                displayName = 'Pacchetto completo';
                displayDesc = (moduleData[mainModule]?.name || mainModule) + ' + Prevenzione';
                upsellValue = module; // z.B. "pulling+anxiety"
            } else if (moduleData[module]) {
                displayIcon = moduleData[module].icon;
                displayName = moduleData[module].name;
                displayDesc = moduleData[module].exercises + ' • 2 settimane';
                upsellValue = module;
            } else {
                displayIcon = '📋';
                displayName = 'Modulo aggiuntivo';
                displayDesc = 'Addestramento avanzato';
                upsellValue = module;
            }

            document.getElementById('moduleIcon').textContent = displayIcon;
            document.getElementById('moduleName').textContent = displayName;
            document.getElementById('moduleDesc').textContent = displayDesc;

            // Upsell-Modul in Supabase speichern - IMMER wenn module vorhanden
            if (leadId) {
                console.log('🔍 Lead ID gefunden:', leadId);
                console.log('📦 Modul zu speichern:', upsellValue, '(Bundle:', isBundle, ')');

                fetch(`${SUPABASE_URL}/rest/v1/wauwerk_leads?id=eq.${leadId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        upsell_module: upsellValue
                    })
                }).then(response => {
                    console.log('📡 Supabase Response Status:', response.status);
                    if (response.ok || response.status === 204) {
                        console.log('✅ Upsell-Modul gespeichert:', upsellValue);
                    } else {
                        response.text().then(text => console.error('❌ Supabase Fehler:', text));
                    }
                }).catch(err => {
                    console.error('❌ Supabase update error:', err);
                });
            } else {
                console.warn('⚠️ Keine lead_id gefunden! URL:', window.location.href);
                console.log('localStorage leadId:', localStorage.getItem('leadId'));
            }
        }

        // ERWEITERTE problemNames mit allen Custom-Keys
        const mainProblem = localStorage.getItem('dogProblem');
        const problemNames = {
            // Standard
            'pulling': 'Tirare al guinzaglio',
            'barking': 'Abbaiare eccessivo',
            'aggression': 'Aggressività',
            'anxiety': 'Ansia da separazione',
            'jumping': 'Saltare addosso alle persone',
            'recall': 'Non torna al richiamo',
            'energy': 'Energia eccessiva',
            'destructive': 'Comportamento distruttivo',
            'soiling': 'Bisogni in casa',
            'mouthing': 'Raccogliere oggetti indesiderati',
            // Custom Angst
            'visitor-anxiety': 'Ansia con gli ospiti',
            'thunder-anxiety': 'Paura dei temporali',
            'noise-sensitivity': 'Sensibilità ai rumori',
            'general-anxiety': 'Ansia generale',
            'stranger-anxiety': 'Paura degli estranei',
            'anxious-overreaction': 'Reazione eccessiva da paura',
            'separation': 'Ansia da separazione',
            // Custom Jagd
            'chasing': 'Comportamenti predatori',
            'chasing-movement': 'Inseguire il movimento',
            'prey-drive': 'Forte istinto predatorio',
            'chasing-cars': 'Inseguire auto/biciclette',
            // Custom Fressen
            'eating-unwanted': 'Mangiare cose indesiderate',
            'eating-trash': 'Mangiare dalla spazzatura',
            'eating-objects': 'Ingerire oggetti',
            // Custom Reaktivität
            'postman-reactive': 'Reattività verso il postino',
            'dog-reactive': 'Reattività verso altri cani',
            'leash-reactive': 'Reattività al guinzaglio',
            'overreaction': 'Reazione eccessiva agli stimoli',
            // Custom Sonstiges
            'vocalization': 'Vocalizzazione eccessiva',
            'resource-guarding': 'Difesa delle risorse',
            'biting': 'Mordere/schioccare i denti',
            'digging': 'Scavare',
            'marking': 'Marcatura in casa',
            'custom-other': 'Altro comportamento'
        };

        if (mainProblem) {
            const problemText = problemNames[mainProblem] || mainProblem;
            document.getElementById('mainProblemName').textContent = problemText + ' – addestramento';
        }

        // Upsell 1 Modul in localStorage speichern für dziekujemy.html
        if (module) {
            localStorage.setItem('upsell1_module', module.split('+')[0]);
        }

        // Nach 2 Sekunden weiter zu Upsell 2 (Video-Analyse)
        setTimeout(function() {
            window.location.href = 'upsell2.html?lead_id=' + (leadId || '');
        }, 2000);
    </script>
