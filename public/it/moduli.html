        // Robust: email/dogName aus dem Lead nachladen. localStorage ueberlebt den

        // der URL. Ohne email schlaegt der Upsell-Checkout mit 400 fehl.
        const SUPABASE_URL = 'https://xomsibpyksrzrnixbdwf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvbXNpYnB5a3NyenJuaXhiZHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2NjMxMjIsImV4cCI6MjA3MjIzOTEyMn0.ZgCwog94HUHz39lbGMJkFPeZ6c-nL4AMFFTz5AgwnKE';
        let _leadDataLoaded = false;
        async function ensureLeadData() {
            if (_leadDataLoaded) return;
            if (userEmail && dogName && dogName !== 'il tuo cane') { _leadDataLoaded = true; return; }
            if (!leadId) return;
            try {
                const r = await fetch(SUPABASE_URL + '/rest/v1/wauwerk_leads?id=eq.' + encodeURIComponent(leadId) + '&select=email,dog_name', {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });
                const rows = await r.json();
                if (rows && rows[0]) {
                    if (!userEmail && rows[0].email) userEmail = rows[0].email;
                    if ((!dogName || dogName === 'il tuo cane') && rows[0].dog_name) {
                        dogName = rows[0].dog_name;
                        document.querySelectorAll('.dog-name').forEach(el => { el.textContent = dogName; });
                    }
                    _leadDataLoaded = true;
                }
            } catch (e) { console.error('ensureLeadData:', e); }
        }
        ensureLeadData();

        document.querySelectorAll('.dog-name').forEach(el => { el.textContent = dogName; });

        // ── Module mit klarer, konkreter Nutzensprache ──
        const moduleData = {
            'anxiety': {
                icon: '🏠',

                exercises: '6 esercizi, 2 settimane',
                benefits: [
                    'Serenità quando parti o vai dal medico',
                    'Rituali di commiato che riducono subito lo stress',
                    'Costruzione passo dopo passo, senza traumi'
                ],
                desc: 'Così ' + dogName + ' non va nel panico quando devi uscire all\'improvviso.',
                hook: 'L\'ansia da separazione spesso si manifesta solo quando non è più possibile prevenirla, di solito dopo la prima separazione più lunga. Questi esercizi vi preparano in 2 settimane.'
            },

                    'Introduci la calma mantenendo la giusta distanza'
                ],
                desc: 'Così porti di nuovo ' + dogName + ' al guinzaglio senza timori, anche dove ci sono molti cani.',
                hook: 'La reattività verso altri cani, senza un addestramento mirato, peggiora invece di sparire. Questi esercizi ti danno strumenti concreti per ogni incontro.'
            },
            'recall': {
                icon: '📣',

                desc: 'Così ' + dogName + ' accoglie gli ospiti con calma, soprattutto gli anziani e i bambini.',

            'mouthing': {

                desc: 'Così non devi controllare di continuo cosa ' + dogName + ' mette in bocca.',
                hook: 'Esche avvelenate, pezzi di vetro, avanzi di cibo: all\'aperto ci sono molte cose che possono essere pericolose. Questi esercizi ti mettono al sicuro.'

            'soiling': {
                icon: '🚫',
                name: 'Sporcare in casa, pulizia senza stress',

        const dogBehaviors = answers.dog_behaviors || JSON.parse(localStorage.getItem('dogBehaviors') || '[]');
        const allUserProblems = [...new Set([dogGoal, dogProblem, ...dogBehaviors].filter(p => p))];

        // Relevanz-Map: welches Modul passt am besten zum Hauptproblem
        const relevanceMap = {
            'pulling':      ['recall', 'energy', 'jumping', 'aggression', 'barking', 'anxiety', 'destructive', 'mouthing', 'soiling'],
            'recall':       ['pulling', 'energy', 'aggression', 'jumping', 'barking', 'anxiety', 'destructive', 'mouthing', 'soiling'],
            'aggression':   ['energy', 'pulling', 'recall', 'anxiety', 'barking', 'jumping', 'destructive', 'mouthing', 'soiling'],
            'anxiety':      ['destructive', 'energy', 'barking', 'pulling', 'recall', 'jumping', 'aggression', 'soiling', 'mouthing'],
            'barking':      ['anxiety', 'energy', 'aggression', 'jumping', 'pulling', 'recall', 'destructive', 'mouthing', 'soiling'],
            'jumping':      ['recall', 'pulling', 'energy', 'barking', 'aggression', 'anxiety', 'destructive', 'mouthing', 'soiling'],

            'destructive':  ['anxiety', 'energy', 'barking', 'pulling', 'recall', 'jumping', 'aggression', 'soiling', 'mouthing'],
            'mouthing':     ['recall', 'energy', 'pulling', 'destructive', 'anxiety', 'barking', 'aggression', 'jumping', 'soiling'],
            'soiling':      ['anxiety', 'destructive', 'energy', 'recall', 'pulling', 'barking', 'jumping', 'aggression', 'mouthing']
        };

        // Empfohlenes Einzelmodul (Fallback: recall)
        function pickRecommended() {
            const allModules = Object.keys(moduleData);
            const available = allModules.filter(m => !allUserProblems.includes(m));
            const pool = available.length ? available : allModules;
            const mainProblem = dogProblem || dogGoal || '';
            const order = relevanceMap[mainProblem] || [];
            const sorted = pool.slice().sort((a, b) => {
                const iA = order.indexOf(a); const iB = order.indexOf(b);
                return (iA === -1 ? 999 : iA) - (iB === -1 ? 999 : iB);
            });
            return sorted[0] || 'recall';
        }

        const recommendedKey = pickRecommended();
        const rec = moduleData[recommendedKey];

                <div class="module-footer">
                    <div>
                        <span class="module-price-new">19,99 €</span>
                        <span class="bundle-savings">solo 10 € in più per tutto</span>
                    </div>
                    <button class="module-btn bundle-btn" id="bundleBuyBtn" onclick="buyBundle()">
                        Scelgo il pacchetto
                    </button>
                </div>
                <div class="module-disclaimer">Tutti i moduli · Subito via e-mail · 30 giorni di garanzia</div>
            `;
            document.getElementById('upsellBundle').appendChild(bundle);
        }
        renderOffers();

        // ── Einzelkauf: 9,99 € (999) ──
        async function buyModule() {
            if (PL_PAYMENTS_OFF) { alert('I pagamenti saranno presto disponibili, ci stiamo lavorando! Grazie per la pazienza. 🐾'); return; }
            const btn = document.getElementById('moduleBuyBtn');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Caricamento...';
            btn.disabled = true;

            await ensureLeadData();
            if (!userEmail) {
                alert('Errore: indirizzo e-mail non trovato.');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            try { fbq('track', 'InitiateCheckout', { value: 9.99, currency: 'EUR', content_name: recommendedKey }); } catch (e) {}

            try {
                const response = await fetch('/api/mollie/upsell-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: recommendedKey,
                        lang: 'it',
                        price: 999,
                        leadId: leadId,
                        email: userEmail,
                        dogName: dogName,
                        returnUrl: '/grazie.html'
                    })
                });
                const result = await response.json();
                if (result.error || !result.url) {
                    alert('Errore durante il caricamento. Riprova.');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }
                window.location.href = result.url;
            } catch (err) {
                console.error('Module Error:', err);
                alert('Errore durante il caricamento.');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ── Paket: 19,99 € (1999) ──
        async function buyBundle() {
            if (PL_PAYMENTS_OFF) { alert('I pagamenti saranno presto disponibili, ci stiamo lavorando! Grazie per la pazienza. 🐾'); return; }
            const btn = document.getElementById('bundleBuyBtn');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Caricamento...';
            btn.disabled = true;

            await ensureLeadData();
            if (!userEmail) {
                alert('Errore: indirizzo e-mail non trovato.');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            // Empfohlener Key + fester Satz (doppelte Keys schaden nicht)
            const bundleModules = recommendedKey + '+recall+pulling+barking';

            try { fbq('track', 'InitiateCheckout', { value: 19.99, currency: 'EUR', content_name: 'bundle' }); } catch (e) {}

            try {
                const response = await fetch('/api/mollie/upsell-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: bundleModules,
                        lang: 'it',
                        price: 1999,
                        bundle: true,
                        leadId: leadId,
                        email: userEmail,
                        dogName: dogName,
                        returnUrl: '/grazie.html'
                    })
                });
                const result = await response.json();
                if (result.error || !result.url) {
                    alert('Errore durante il caricamento. Riprova.');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }
                window.location.href = result.url;
            } catch (err) {
                console.error('Bundle Error:', err);
                alert('Errore durante il caricamento.');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
    </script>
