        /* --- Handy-Korrekturen fuer diese Seite --- */

<body>
    <header class="header">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Pfoten-Plan Logo" class="logo-image">
            <span class="logo-text">Pfoten-Plan</span>
        </a>
    </header>
    <div class="container">
        <div class="progress-container">
            <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
            <p style="text-align: center; font-size: 11px; color: var(--text-light); margin-top: 6px;">Fast geschafft</p>
        </div>

        <h1 class="page-title">Gibt es etwas Besonderes an <span id="dogNameTitle">deinem Hund</span>?</h1>

        <p style="text-align:center;font-size:14.5px;color:#6B6B6B;line-height:1.6;margin:-12px 0 20px;">
            z.&nbsp;B. aus dem Tierschutz, taub, Angst vor M&auml;nnern, reagiert nicht auf Leckerli.
            Oder: du sitzt im <b style="color:var(--text-dark);">Rollstuhl</b> oder bist wenig mobil.
            <b style="color:var(--text-dark);">Wir passen den Plan darauf an.</b>
        </p>

        <textarea id="specialNotes" maxlength="600" rows="5"
            placeholder="Erz&auml;hl uns kurz, was wichtig ist&hellip;"
            style="width:100%;box-sizing:border-box;min-height:130px;border:1px solid #D9C7A6;border-radius:12px;
                   padding:14px 15px;font-size:16px;font-family:inherit;line-height:1.55;resize:vertical;
                   outline:none;color:var(--text-dark);background:#FFFDF9;"></textarea>

        <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 2px 0;">
            <span style="font-size:12px;color:#9B9B9B;">Freiwillig</span>
            <span style="font-size:12px;color:#9B9B9B;"><span id="charCount">0</span>/600</span>
        </div>

        <a href="kurz-schritt10.html" class="continue-btn" id="continueBtn">Weiter &rarr;</a>

        <div style="text-align:center;margin:18px 0 0;">
            <a href="#" id="skipBtn" style="font-size:15px;color:#8A8A8A;text-decoration:underline;padding:13px 20px;display:inline-block;min-height:44px;box-sizing:border-box;">&Uuml;berspringen</a>
        </div>
    </div>


    <script>
        (function () {
            var dogName = localStorage.getItem('dogName') || 'deinem Hund';
            var t = document.getElementById('dogNameTitle');
            if (t) t.textContent = dogName;

            var ta = document.getElementById('specialNotes');
            var cc = document.getElementById('charCount');

            // Bereits Geschriebenes zurueckholen, falls jemand zurueck navigiert.
            try {
                var alt = localStorage.getItem('special_notes');
                if (alt && ta) { ta.value = alt; }
            } catch (e) {}

            function zaehle() { if (cc && ta) cc.textContent = String(ta.value.length); }
            if (ta) { ta.addEventListener('input', zaehle); zaehle(); }

            function sichern() {
                try {
                    var v = ta && ta.value ? ta.value.trim().slice(0, 600) : '';
                    if (v) { localStorage.setItem('special_notes', v); }
                    else { localStorage.removeItem('special_notes'); }
                } catch (e) {}
            }

            // Beide Wege speichern: "Weiter" sichert den Text, "Ueberspringen"
            // raeumt ihn weg. Danach geht es in beiden Faellen gleich weiter.
            var weiter = document.getElementById('continueBtn');
            if (weiter) weiter.addEventListener('click', sichern);

            var skip = document.getElementById('skipBtn');
            if (skip) skip.addEventListener('click', function (e) {
                e.preventDefault();
                try { localStorage.removeItem('special_notes'); } catch (e2) {}
                window.location.href = 'kurz-schritt10.html';
            });

            if (window.clarity) { window.clarity('set', 'seite', 'notizseite'); }
        })();
    </script>
