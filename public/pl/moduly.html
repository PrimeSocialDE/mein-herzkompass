    <script>
        let dogName = localStorage.getItem('dogName') || 'Twojego psa';
        const dogAge = localStorage.getItem('dogAge') || 'adult';
        const urlParamsInit = new URLSearchParams(window.location.search);
        const leadId = urlParamsInit.get('lead_id') || localStorage.getItem('leadId') || '';
        let userEmail = localStorage.getItem('userEmail') || '';

        // Robust: email/dogName aus dem Lead nachladen. localStorage ueberlebt den
        // Mollie/BLIK-Umweg auf dem Handy nicht immer; leadId kommt zuverlaessig aus
        // der URL. Ohne email schlaegt der Upsell-Checkout mit 400 fehl.
        const SUPABASE_URL = 'https://xomsibpyksrzrnixbdwf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhvbXNpYnB5a3NyenJuaXhiZHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2NjMxMjIsImV4cCI6MjA3MjIzOTEyMn0.ZgCwog94HUHz39lbGMJkFPeZ6c-nL4AMFFTz5AgwnKE';
        let _leadDataLoaded = false;
        async function ensureLeadData() {
            if (_leadDataLoaded) return;
            if (userEmail && dogName && dogName !== 'Twojego psa') { _leadDataLoaded = true; return; }
            if (!leadId) return;
            try {
                const r = await fetch(SUPABASE_URL + '/rest/v1/wauwerk_leads?id=eq.' + encodeURIComponent(leadId) + '&select=email,dog_name', {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                });
                const rows = await r.json();
                if (rows && rows[0]) {
                    if (!userEmail && rows[0].email) userEmail = rows[0].email;
                    if ((!dogName || dogName === 'Twojego psa') && rows[0].dog_name) {
                        dogName = rows[0].dog_name;
                        document.querySelectorAll('.dog-name').forEach(el => { el.textContent = dogName; });
                    }
                    _leadDataLoaded = true;
                }
            } catch (e) { console.error('ensureLeadData:', e); }
        }
        ensureLeadData();

        document.querySelectorAll('.dog-name').forEach(el => { el.textContent = dogName; });

                hook: 'Lęk separacyjny często pojawia się dopiero wtedy, gdy nie da się go już zapobiec, zwykle po pierwszym dłuższym rozstaniu. Te ćwiczenia przygotują Was w 2 tygodnie.'

                name: 'Chodzenie na luźnej smyczy, spokojne spacery',

                benefits: [

                ],
                desc: 'Żebyś znów chętnie wychodził z ' + dogName + ' na spacer, bez bólu ramienia.',
                hook: 'Ciągnięcie na smyczy rzadko poprawia się samo, zwłaszcza u pobudliwych psów. Te ćwiczenia dają Ci konkretne techniki na co dzień.'

                    'Prawidłowa budowa przywołania, bez "spalenia" komendy',

                ],
                desc: 'Żeby ' + dogName + ' w razie potrzeby natychmiast wracał, nawet gdy w pobliżu jest sarna albo samochód.',

            'jumping': {

            'energy': {

                benefits: [
                    'Celowane ćwiczenia wyciszające na każdy dzień',
                    'Praca głową zamiast ciągłego wybiegania',

                ],
                desc: 'Żeby ' + dogName + ' nauczył się wyłączać, zamiast być ciągle w gotowości.',
                hook: 'Psy, które nie potrafią się wyciszyć, gorzej się uczą. Bez treningu spokoju ' + dogName + ' sam się blokuje w codzienności.'

            'destructive': {
                icon: '🧸',
                name: 'Niszczenie w domu, meble i buty zostają całe',
                exercises: '6 ćwiczeń, 2 tygodnie',
                benefits: [
                    'Pewne wprowadzenie dozwolonych alternatyw',
                    'Przekierowanie gryzienia zamiast kary',
                    'Zostawanie samemu bez chaosu'
                ],
                desc: 'Żebyś nie musiał co tydzień kupować nowych butów albo mebli.',
                hook: 'Niszczenie to zwykle objaw stresu lub niedostatecznej stymulacji. Ten moduł działa na przyczynę.'
            },
            'mouthing': {
                icon: '🦴',
                name: 'Podnoszenie rzeczy z ziemi, bezpiecznie na dworze',
                exercises: '6 ćwiczeń, 2 tygodnie',
                benefits: [
                    'Pewne wprowadzenie komendy "zostaw"',
                    'Ochrona przed trutkami na co dzień',
                    'Spacery bez obaw'
                ],
                desc: 'Żebyś nie musiał ciągle pilnować, co ' + dogName + ' bierze do pyska.',
                hook: 'Trutki, kawałki szkła, resztki jedzenia, na dworze jest wiele rzeczy, które mogą być groźne. Te ćwiczenia Cię zabezpieczą.'
            },
            'soiling': {
                icon: '🚫',
                name: 'Nieczystość w domu, czysto bez stresu',
                exercises: '6 ćwiczeń, 2 tygodnie',
                benefits: [
                    'Jasny plan wychodzenia dopasowany do dnia',
                    'Rozpoznawanie sygnałów, zanim będzie za późno',
                    'Spokojne, konsekwentne budowanie czystości'
                ],
                desc: 'Żeby ' + dogName + ' nauczył się załatwiać na dworze, bez stresu i kary.',
                hook: 'Nieczystość w domu rzadko mija sama, częściej wynika z braku jasnej rutyny. Ten moduł ją porządkuje.'
            }
        };

        // Problem psa z quizu / localStorage / URL
        const answers = JSON.parse(localStorage.getItem('wauwerk_answers') || '{}');
        const dogGoal = answers.dog_goal || urlParamsInit.get('problem') || localStorage.getItem('dogProblemKey') || '';
        const dogProblem = answers.dog_problem || localStorage.getItem('dogProblem') || '';
        const dogBehaviors = answers.dog_behaviors || JSON.parse(localStorage.getItem('dogBehaviors') || '[]');
        const allUserProblems = [...new Set([dogGoal, dogProblem, ...dogBehaviors].filter(p => p))];

        // Mapa trafności: który moduł najlepiej pasuje do głównego problemu
        const relevanceMap = {
            'pulling':      ['recall', 'energy', 'jumping', 'aggression', 'barking', 'anxiety', 'destructive', 'mouthing', 'soiling'],
            'recall':       ['pulling', 'energy', 'aggression', 'jumping', 'barking', 'anxiety', 'destructive', 'mouthing', 'soiling'],
            'aggression':   ['energy', 'pulling', 'recall', 'anxiety', 'barking', 'jumping', 'destructive', 'mouthing', 'soiling'],
            'anxiety':      ['destructive', 'energy', 'barking', 'pulling', 'recall', 'jumping', 'aggression', 'soiling', 'mouthing'],
            'barking':      ['anxiety', 'energy', 'aggression', 'jumping', 'pulling', 'recall', 'destructive', 'mouthing', 'soiling'],
            'jumping':      ['recall', 'pulling', 'energy', 'barking', 'aggression', 'anxiety', 'destructive', 'mouthing', 'soiling'],
            'energy':       ['pulling', 'destructive', 'recall', 'jumping', 'barking', 'anxiety', 'aggression', 'mouthing', 'soiling'],
            'destructive':  ['anxiety', 'energy', 'barking', 'pulling', 'recall', 'jumping', 'aggression', 'soiling', 'mouthing'],
            'mouthing':     ['recall', 'energy', 'pulling', 'destructive', 'anxiety', 'barking', 'aggression', 'jumping', 'soiling'],
            'soiling':      ['anxiety', 'destructive', 'energy', 'recall', 'pulling', 'barking', 'jumping', 'aggression', 'mouthing']
        };

        // Rekomendowany pojedynczy moduł (fallback: recall)
        function pickRecommended() {
            const allModules = Object.keys(moduleData);
            const available = allModules.filter(m => !allUserProblems.includes(m));
            const pool = available.length ? available : allModules;
            const mainProblem = dogProblem || dogGoal || '';
            const order = relevanceMap[mainProblem] || [];
            const sorted = pool.slice().sort((a, b) => {
                const iA = order.indexOf(a); const iB = order.indexOf(b);
                return (iA === -1 ? 999 : iA) - (iB === -1 ? 999 : iB);
            });
            return sorted[0] || 'recall';
        }

        const recommendedKey = pickRecommended();
        const rec = moduleData[recommendedKey];

                <div class="badge">Najlepszy wybór</div>
                <div class="module-header">
                    <span class="module-icon">📦</span>
                    <span class="module-name">Pakiet: wszystkie moduły treningowe</span>
                </div>
                <p class="module-desc">Wszystkie moduły tematyczne w jednym: przywołanie, luźna smycz, szczekanie i więcej. Kompletny zestaw dla ${dogName}.</p>
                <div class="module-benefits">
                    <div class="module-benefit">Wszystkie moduły tematyczne, nie tylko jeden</div>
                    <div class="module-benefit">Gotowy na każde wyzwanie, które przyjdzie</div>
                    <div class="module-benefit">Największa oszczędność, jedna niska cena</div>
                </div>
                <div class="module-footer">
                    <div>
                        <span class="module-price-new">89 zł</span>
                        <span class="bundle-savings">tylko 30 zł więcej za wszystko</span>
                    </div>
                    <button class="module-btn bundle-btn" id="bundleBuyBtn" onclick="buyBundle()">
                        Wybieram pakiet
                    </button>
                </div>
                <div class="module-disclaimer">Wszystkie moduły · Od razu na e-mail · 30 dni gwarancji</div>
            `;
            document.getElementById('upsellBundle').appendChild(bundle);
        }
        renderOffers();

        // ── Pojedynczy zakup: 59 zł (5900) ──
        async function buyModule() {
            const btn = document.getElementById('moduleBuyBtn');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Ładowanie...';
            btn.disabled = true;

            await ensureLeadData();
            if (!userEmail) {
                alert('Błąd: nie znaleziono adresu e-mail.');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            try { fbq('track', 'InitiateCheckout', { value: 59, currency: 'PLN', content_name: recommendedKey }); } catch (e) {}

            try {
                const response = await fetch('/api/mollie/upsell-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: recommendedKey,
                        lang: 'pl',
                        price: 5900,
                        leadId: leadId,
                        email: userEmail,
                        dogName: dogName,
                        returnUrl: '/dziekujemy.html'
                    })
                });
                const result = await response.json();
                if (result.error || !result.url) {
                    alert('Błąd podczas ładowania. Spróbuj ponownie.');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }
                window.location.href = result.url;
            } catch (err) {
                console.error('Module Error:', err);
                alert('Błąd podczas ładowania.');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // ── Pakiet: 89 zł (8900) ──
        async function buyBundle() {
            const btn = document.getElementById('bundleBuyBtn');
            const originalText = btn.textContent;
            btn.innerHTML = '<span class="spinner"></span> Ładowanie...';
            btn.disabled = true;

            await ensureLeadData();
            if (!userEmail) {
                alert('Błąd: nie znaleziono adresu e-mail.');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            // Rekomendowany klucz + stały zestaw (zduplikowane klucze nie szkodzą)
            const bundleModules = recommendedKey + '+recall+pulling+barking';

            try { fbq('track', 'InitiateCheckout', { value: 89, currency: 'PLN', content_name: 'bundle' }); } catch (e) {}

            try {
                const response = await fetch('/api/mollie/upsell-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: bundleModules,
                        lang: 'pl',
                        price: 8900,
                        bundle: true,
                        leadId: leadId,
                        email: userEmail,
                        dogName: dogName,
                        returnUrl: '/dziekujemy.html'
                    })
                });
                const result = await response.json();
                if (result.error || !result.url) {
                    alert('Błąd podczas ładowania. Spróbuj ponownie.');
                    btn.textContent = originalText;
                    btn.disabled = false;
                    return;
                }
                window.location.href = result.url;
            } catch (err) {
                console.error('Bundle Error:', err);
                alert('Błąd podczas ładowania.');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
