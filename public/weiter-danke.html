<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danke | Pfoten-Plan</title><link rel="icon" type="image/png" href="/favconHund.png"><meta name="robots" content="noindex">
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#FAF8F5;color:#2C2C2E;margin:0;padding:40px 18px;line-height:1.6}
.k{max-width:520px;margin:0 auto;background:#fff;border:1px solid #E8E4DF;border-radius:16px;padding:28px;text-align:center;box-shadow:0 6px 22px rgba(196,165,118,.15)}

<body><div class="k"><div class="p">🐾</div><h1>Danke, der Aufbauplan ist in Arbeit!</h1>
<p>Wir stellen gerade <b id="h">die neuen Übungen</b> zusammen, passend zu dem, was du uns geschrieben hast. In etwa <b id="z">30 Minuten</b> bekommst du den Plan als PDF per E-Mail. Schau bitte auch im Spam-Ordner nach.</p>
<p style="font-size:14px">Fragen? Schreib uns an support@pfoten-plan.de</p></div>
<script>try{const q=new URLSearchParams(location.search);const d=q.get('dog');if(d)document.getElementById('h').textContent='die neuen Übungen für '+d;if(q.get('m')==='6')document.getElementById('z').textContent='30 bis 40 Minuten';}catch(e){}
try{localStorage.setItem('purchased','1');}catch(e){}</script></body></html>
